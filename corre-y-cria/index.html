<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corre y Cria — Carreira Visual</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;padding:32px;
    background:#000;color:#fff;font-family:'General Sans','Inter',-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:0;
    background:radial-gradient(60% 60% at 20% 30%,rgba(255,109,41,.28),transparent 65%),
               radial-gradient(50% 50% at 80% 70%,rgba(69,48,39,.7),transparent 70%);filter:blur(70px)}
  .box{position:relative;z-index:1;max-width:520px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a8386;font-family:ui-monospace,monospace}
  h1{font-size:clamp(28px,6vw,46px);letter-spacing:-.035em;line-height:1.02;margin:16px 0 0;font-weight:600}
  p{color:rgba(255,255,255,.66);margin:18px 0 0;line-height:1.55}
  a{display:inline-flex;align-items:center;gap:9px;margin-top:30px;height:48px;padding:0 26px;border-radius:999px;
    background:#FF6D29;color:#150a04;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <span class="kicker">● Carreira Visual</span>
    <h1>Corre y Cria</h1>
    <p>A página deste treinamento está sendo preparada. Enquanto isso, explore o restante da plataforma.</p>
    <a href="/">Voltar para a plataforma</a>
  </div>
</body>
</html>
